<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>TPS-G Portal — Entity Relationship Diagram (ERD)</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      user-select: none;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--background, #0f172a);
      color: var(--foreground, #f8fafc);
    }
    .erd-canvas-container {
      width: 100vw;
      height: 100vh;
      position: relative;
      cursor: grab;
    }
    .erd-canvas-container:active {
      cursor: grabbing;
    }
    .table-card {
      transition: box-shadow 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
    }
    .table-card.dimmed {
      opacity: 0.25;
    }
    .table-card.highlighted {
      border-color: #38bdf8 !important;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
      opacity: 1 !important;
    }
    .rel-line {
      transition: stroke 0.2s ease, stroke-width 0.2s ease, opacity 0.2s ease;
      stroke-dasharray: 6 3;
      animation: dash 30s linear infinite;
    }
    @keyframes dash {
      to {
        stroke-dashoffset: -1000;
      }
    }
    .rel-line.dimmed {
      opacity: 0.1;
    }
    .rel-line.highlighted {
      stroke: #38bdf8 !important;
      stroke-width: 3 !important;
      opacity: 1 !important;
    }
  </style>
</head>
<body class="bg-[var(--background,#090d16)] text-[var(--foreground,#f1f5f9)]">

  <!-- Header Controls -->
  <header class="absolute top-4 left-4 right-4 z-20 flex flex-wrap items-center justify-between gap-3 bg-[var(--card,#1e293b)]/90 backdrop-blur-md p-3.5 rounded-xl border border-[var(--border,#334155)] shadow-xl">
    <div class="flex items-center gap-3">
      <div class="h-9 w-9 rounded-lg bg-red-600 flex items-center justify-center font-bold text-white shadow-md">
        TPS
      </div>
      <div>
        <h1 class="font-bold text-base tracking-tight leading-tight">TPS-G Portal Database ERD</h1>
        <p class="text-xs text-[var(--muted-foreground,#94a3b8)]">16 Tabel &bull; Laravel 12 Schema &bull; Relasi Interaktif</p>
      </div>
    </div>

    <!-- Cluster Filters & Search -->
    <div class="flex items-center gap-2">
      <input type="text" id="searchInput" placeholder="Cari tabel / kolom..." 
             class="bg-[var(--background,#0f172a)] border border-[var(--border,#475569)] rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-sky-500 w-48 text-[var(--foreground,#f8fafc)]">

      <button id="btnResetView" class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs rounded-lg border border-slate-600 text-slate-200 transition">
        Reset Zoom
      </button>

      <div class="flex items-center bg-slate-800/80 rounded-lg p-1 border border-slate-700 text-xs">
        <button id="zoomIn" class="px-2 py-0.5 hover:bg-slate-700 rounded font-bold text-sm">+</button>
        <span id="zoomLevel" class="px-2 text-[11px] font-mono text-slate-400">100%</span>
        <button id="zoomOut" class="px-2 py-0.5 hover:bg-slate-700 rounded font-bold text-sm">-</button>
      </div>
    </div>
  </header>

  <!-- Legend -->
  <div class="absolute bottom-4 left-4 z-20 bg-[var(--card,#1e293b)]/85 backdrop-blur-md px-3.5 py-2.5 rounded-xl border border-[var(--border,#334155)] shadow-lg flex items-center gap-4 text-xs">
    <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span><span class="text-slate-300">PK (Primary Key)</span></div>
    <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-sky-400"></span><span class="text-slate-300">FK (Foreign Key)</span></div>
    <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-purple-400"></span><span class="text-slate-300">UK (Unique Key)</span></div>
    <div class="text-[11px] text-slate-400 border-l border-slate-700 pl-3">Klik tabel untuk menyorot relasi</div>
  </div>

  <!-- Canvas Container -->
  <div id="container" class="erd-canvas-container">
    <div id="panZoomWorld" style="transform-origin: 0 0; position: absolute; left: 0; top: 0; width: 3400px; height: 2100px;">
      
      <!-- SVG Lines for Relations -->
      <svg id="relSvg" class="absolute inset-0 w-full h-full pointer-events-none" style="z-index: 1;">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
          </marker>
          <marker id="arrow-highlight" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
          </marker>
        </defs>
        <!-- Lines will be dynamically generated and drawn here -->
      </svg>

      <!-- Table Nodes -->
      <div id="nodesContainer" class="relative w-full h-full" style="z-index: 2;"></div>

    </div>
  </div>

    // Relationships
    const relationships = [
      { from: 'plants', to: 'employees', label: 'plant_id' },

      { from: 'departments', to: 'employees', label: 'department_id' },
      { from: 'employees', to: 'user_accounts', label: 'employee_id' },
      { from: 'employees', to: 'activity_plans', label: 'employee_id' },
      { from: 'activity_plans', to: 'activity_progress', label: 'activity_plan_id' },
      { from: 'activity_plans', to: 'activity_followups', label: 'activity_plan_id' },
      { from: 'user_accounts', to: 'activity_followups', label: 'admin_id' },
      { from: 'user_accounts', to: 'workshops', label: 'created_by' },
      { from: 'employees', to: 'workshop_candidates', label: 'employee_id' },
      { from: 'user_accounts', to: 'workshop_candidates', label: 'recommended_by' },
      { from: 'workshop_candidates', to: 'workshop_hrd_reviews', label: 'candidate_id' },
      { from: 'user_accounts', to: 'workshop_hrd_reviews', label: 'hrd_id' },
      { from: 'workshops', to: 'workshop_participants', label: 'workshop_id' },

      { from: 'workshop_candidates', to: 'workshop_participants', label: 'candidate_id' },
      { from: 'user_accounts', to: 'workshop_participants', label: 'confirmed_by' },
      { from: 'workshop_participants', to: 'workshop_evaluations', label: 'participant_id' },

    // Render Table Cards

      card.className = `table-card absolute w-80 bg-slate-900/90 backdrop-blur-sm rounded-xl border border-slate-700/80 shadow-2xl overflow-hidden cursor-pointer`;

      card.style.top = `${table.y}px`;

      const headerClass = colorHeaderMap[table.color] || 'from-slate-700 to-slate-800 text-slate-100';

      let fieldsHtml = table.fields.map(f => {
        let keyBadge = '';
        if (f.key === 'PK') keyBadge = `<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-amber-400/20 text-amber-300 border border-amber-400/30">PK</span>`;
        if (f.key === 'FK') keyBadge = `<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-sky-400/20 text-sky-300 border border-sky-400/30">FK</span>`;
        if (f.key === 'UK') keyBadge = `<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-purple-400/20 text-purple-300 border border-purple-400/30">UK</span>`;

        return `
          <div class="flex items-center justify-between px-3 py-1.5 border-b border-slate-800/80 hover:bg-slate-800/50 text-xs">

            <span class="text-[11px] font-mono text-slate-400 ml-2">${f.type}</span>

        <div class="bg-gradient-to-r ${headerClass} px-3.5 py-2.5 flex items-center justify-between border-b">

            <div class="text-[10px] uppercase font-bold tracking-wider opacity-75">${table.category}</div>
            <div class="font-bold text-sm tracking-wide">${table.name}</div>
          </div>
          <span class="text-xs font-mono bg-black/20 px-2 py-0.5 rounded-full">${table.fields.length}</span>
        </div>
        <div class="max-h-72 overflow-y-auto">
          ${fieldsHtml}
        </div>
      `;

      card.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleHighlight(table.id);
      });

      nodesContainer.appendChild(card);
    });

    // Draw SVG Relation Lines
    function drawRelations() {
      // Clear existing lines
      while (relSvg.children.length > 1) { // keep defs
        relSvg.removeChild(relSvg.lastChild);
      }

      relationships.forEach((rel, index) => {
        const fromEl = document.getElementById(`node-${rel.from}`);
        const toEl = document.getElementById(`node-${rel.to}`);
        if (!fromEl || !toEl) return;

        const fromTable = tables.find(t => t.id === rel.from);
        const toTable = tables.find(t => t.id === rel.to);

        const fromRect = {
          x: fromTable.x,
          y: fromTable.y,
          w: fromEl.offsetWidth,
          h: fromEl.offsetHeight
        };
        const toRect = {
          x: toTable.x,
          y: toTable.y,
          w: toEl.offsetWidth,
          h: toEl.offsetHeight
        };

        // Determine best connection points
        let startX, startY, endX, endY;

        if (fromRect.x + fromRect.w < toRect.x) {
          // From is to the left of To
          startX = fromRect.x + fromRect.w;
          startY = fromRect.y + Math.min(80, fromRect.h / 2);
          endX = toRect.x;
          endY = toRect.y + Math.min(80, toRect.h / 2);
        } else if (fromRect.x > toRect.x + toRect.w) {
          // From is to the right of To
          startX = fromRect.x;
          startY = fromRect.y + Math.min(80, fromRect.h / 2);
          endX = toRect.x + toRect.w;
          endY = toRect.y + Math.min(80, toRect.h / 2);
        } else {
          // Vertical layout
          startX = fromRect.x + fromRect.w / 2;
          startY = fromRect.y + fromRect.h;
          endX = toRect.x + toRect.w / 2;
          endY = toRect.y;
        }

        const deltaX = Math.abs(endX - startX) / 2;
        const deltaY = Math.abs(endY - startY) / 2;
        const cp1X = startX < endX ? startX + deltaX : startX - deltaX;
        const cp1Y = startY;
        const cp2X = startX < endX ? endX - deltaX : endX + deltaX;
        const cp2Y = endY;

        const pathD = `M ${startX} ${startY} C ${cp1X} ${cp1Y}, ${cp2X} ${cp2Y}, ${endX} ${endY}`;

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', pathD);
        path.setAttribute('class', 'rel-line');
        path.setAttribute('stroke', '#64748b');
        path.setAttribute('stroke-width', '1.5');
        path.setAttribute('fill', 'none');
        path.setAttribute('marker-end', 'url(#arrow)');
        path.dataset.from = rel.from;
        path.dataset.to = rel.to;
        path.id = `rel-${rel.from}-${rel.to}-${index}`;

        relSvg.appendChild(path);
      });
    }

    // Highlighting Logic
    let activeTableId = null;

    function toggleHighlight(tableId) {
      if (activeTableId === tableId) {
        clearHighlight();
        return;
      }
      activeTableId = tableId;

      const connectedTableIds = new Set([tableId]);
      const connectedLines = [];

      relationships.forEach(rel => {
        if (rel.from === tableId || rel.to === tableId) {
          connectedTableIds.add(rel.from);
          connectedTableIds.add(rel.to);
        }
      });

      // Update Cards
      tables.forEach(t => {
        const el = document.getElementById(`node-${t.id}`);
        if (connectedTableIds.has(t.id)) {
          el.classList.remove('dimmed');
          el.classList.add('highlighted');
        } else {
          el.classList.add('dimmed');
          el.classList.remove('highlighted');
        }
      });

      // Update Lines
      document.querySelectorAll('.rel-line').forEach(line => {
        if (line.dataset.from === tableId || line.dataset.to === tableId) {
          line.classList.remove('dimmed');
          line.classList.add('highlighted');
          line.setAttribute('marker-end', 'url(#arrow-highlight)');
        } else {
          line.classList.add('dimmed');
          line.classList.remove('highlighted');
          line.setAttribute('marker-end', 'url(#arrow)');
        }
      });
    }

    function clearHighlight() {
      activeTableId = null;
      document.querySelectorAll('.table-card').forEach(el => {
        el.classList.remove('dimmed', 'highlighted');
      });
      document.querySelectorAll('.rel-line').forEach(line => {
        line.classList.remove('dimmed', 'highlighted');
        line.setAttribute('marker-end', 'url(#arrow)');
      });
    }

    document.body.addEventListener('click', () => {
      clearHighlight();
    });

    // Pan & Zoom
    let scale = 0.72;
    let panX = 40;
    let panY = 70;
    let isDragging = false;
    let startX, startY;

    function updateTransform() {
      panZoomWorld.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
      document.getElementById('zoomLevel').innerText = `${Math.round(scale * 100)}%`;
    }

    container.addEventListener('mousedown', (e) => {
      if (e.target.closest('.table-card')) return;
      isDragging = true;
      startX = e.clientX - panX;
      startY = e.clientY - panY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      panX = e.clientX - startX;
      panY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
    });

    container.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
      const newScale = Math.min(Math.max(0.3, scale * zoomFactor), 2.0);
      
      const mouseX = e.clientX;
      const mouseY = e.clientY;
      panX = mouseX - (mouseX - panX) * (newScale / scale);
      panY = mouseY - (mouseY - panY) * (newScale / scale);
      scale = newScale;
      updateTransform();
    }, { passive: false });

    document.getElementById('zoomIn').addEventListener('click', () => {
      scale = Math.min(2.0, scale * 1.2);
      updateTransform();
    });

    document.getElementById('zoomOut').addEventListener('click', () => {
      scale = Math.max(0.3, scale / 1.2);
      updateTransform();
    });

    document.getElementById('btnResetView').addEventListener('click', () => {
      scale = 0.72;
      panX = 40;
      panY = 70;
      updateTransform();
      clearHighlight();
    });

    // Search filter
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) {
        clearHighlight();
        return;
      }

      tables.forEach(t => {
        const el = document.getElementById(`node-${t.id}`);
        const matchTable = t.name.toLowerCase().includes(q) || t.category.toLowerCase().includes(q);
        const matchField = t.fields.some(f => f.name.toLowerCase().includes(q));

        if (matchTable || matchField) {
          el.classList.remove('dimmed');
          el.classList.add('highlighted');
        } else {
          el.classList.add('dimmed');
          el.classList.remove('highlighted');
        }
      });
    });

    // Initialize
    window.addEventListener('load', () => {
      drawRelations();
      updateTransform();
    });
    window.addEventListener('resize', drawRelations);
  </script>
</body>
</html>
